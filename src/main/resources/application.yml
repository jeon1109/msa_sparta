spring:
  ai:
    model:
      chat: ${AI_CHAT_MODEL:none}
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      api-key: ${AI_API_KEY:}
      base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      chat:
        completions-path: ${AI_COMPLETIONS_PATH:/chat/completions}
        options:
          model: ${AI_MODEL:gemini-2.5-flash}
  application:
    name: lesson

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/sparta}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    org.hibernate.SQL: DEBUG

server:
  port: 8080

springdoc:
  swagger-ui:
    enabled: true
lesson:
  ai:
    daily-limit: ${AI_DAILY_LIMIT:10}
